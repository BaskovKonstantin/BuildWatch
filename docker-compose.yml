services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      BUILDWATCH_SQLITE_PATH: /data/buildwatch.db
      BUILDWATCH_ZEN_MODEL: ${BUILDWATCH_ZEN_MODEL:-glm-5.3-flash}
      BUILDWATCH_ZEN_KEY: ${BUILDWATCH_ZEN_KEY:-}
    volumes:
      - buildwatch-data:/data
      - buildwatch-media:/app/backend/media
      - ./context/dgp_extract:/app/context/dgp_extract:ro
    ports: ["8600:8600"]
    command: ["sh", "-c", "if [ ! -f /data/buildwatch.db ]; then if [ -f /app/context/dgp_extract/Сводный перечень строительных работ_ЛТЦ.xlsx ] && [ -f /app/context/detector_compare.json ]; then python seed.py; else python /app/scripts/seed_public_demo.py; fi; fi && uvicorn app:app --host 0.0.0.0 --port 8600"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      BUILDWATCH_SQLITE_PATH: /data/buildwatch.db
      BUILDWATCH_DETECTOR_MODEL: equipment
    volumes:
      - buildwatch-data:/data
      - buildwatch-media:/app/backend/media
      - ./context/dgp_extract:/app/context/dgp_extract:ro
      - ./weights:/app/weights:ro
    depends_on: [api]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILDWATCH_API_ORIGIN: http://api:8600
    environment:
      BUILDWATCH_API_ORIGIN: http://api:8600
    ports: ["8700:3000"]
    depends_on: [api]
volumes:
  buildwatch-data:
  buildwatch-media:
