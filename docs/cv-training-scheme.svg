<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">Как обучали CV-модель BuildWatch</title>
  <desc id="desc">Поток данных из пяти источников, подготовка и разметка, разбиение на обучение и проверку, дообучение YOLOv8m и текущие метрики двух эпох.</desc>
  <defs>
    <style>
      text { font-family: Arial, "DejaVu Sans", sans-serif; fill: #18211f; }
      .mono { font-family: "DejaVu Sans Mono", monospace; letter-spacing: 1px; }
      .muted { fill: #59635e; }
      .white { fill: #fffdf8; }
      .darknote { fill: #c7d0c9; }
      .card { fill: #fffdf8; stroke: #23312c; stroke-width: 2; }
      .line { stroke: #d9530b; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9530b"/></marker>
  </defs>
  <rect width="1440" height="1020" fill="#f6f4ef"/>
  <rect x="0" y="0" width="1440" height="14" fill="#d9530b"/>

  <text x="72" y="76" class="mono muted" font-size="16">BUILDWATCH · COMPUTER VISION · 28 СЕНТЯБРЯ 2026</text>
  <text x="72" y="132" font-size="42" font-weight="700">Как обучали модель CV</text>
  <text x="72" y="170" class="muted" font-size="20">Детектор строительной техники: сбор данных → разметка → дообучение → проверка</text>

  <!-- Data sources -->
  <rect x="72" y="218" width="294" height="330" rx="8" class="card"/>
  <rect x="72" y="218" width="294" height="54" rx="8" fill="#24352e"/>
  <text x="96" y="253" class="white mono" font-size="16">01 / ИСТОЧНИКИ</text>
  <text x="96" y="305" font-size="20" font-weight="700">Разные условия и техника</text>
  <circle cx="101" cy="345" r="5" fill="#d9530b"/><text x="118" y="351" font-size="17">Kaggle · строительная техника</text>
  <circle cx="101" cy="382" r="5" fill="#d9530b"/><text x="118" y="388" font-size="17">MOCS · строительные сцены</text>
  <circle cx="101" cy="419" r="5" fill="#d9530b"/><text x="118" y="425" font-size="17">Open Images · грузовики</text>
  <circle cx="101" cy="456" r="5" fill="#d9530b"/><text x="118" y="462" font-size="17">GitHub · экскаваторы</text>
  <circle cx="101" cy="493" r="5" fill="#d9530b"/><text x="118" y="499" font-size="16">Фото площадок + внешние данные</text>
  <text x="96" y="516" class="muted" font-size="13">Реальные, открытые и</text>
  <text x="96" y="534" class="muted" font-size="13">синтетические примеры</text>

  <!-- Prepare -->
  <rect x="408" y="218" width="294" height="330" rx="8" class="card"/>
  <rect x="408" y="218" width="294" height="54" rx="8" fill="#24352e"/>
  <text x="432" y="253" class="white mono" font-size="16">02 / ПОДГОТОВКА</text>
  <text x="432" y="305" font-size="20" font-weight="700">Единый формат YOLO</text>
  <text x="432" y="344" font-size="16">• проверка и очистка боксов</text>
  <text x="432" y="378" font-size="16">• согласование классов</text>
  <text x="432" y="412" font-size="15">• удаление дублей и спорных меток</text>
  <text x="432" y="446" font-size="16">• добавление мелких объектов</text>
  <text x="432" y="478" font-size="14" class="muted">Разметки сведены к 8 классам:</text>
  <text x="432" y="500" font-size="13" class="muted">экскаватор · самосвал · каток · КМУ</text>
  <text x="432" y="518" font-size="13" class="muted">бетономешалка · бульдозер</text>
  <text x="432" y="536" font-size="13" class="muted">грузовик · автокран</text>

  <!-- Split -->
  <rect x="744" y="218" width="294" height="330" rx="8" class="card"/>
  <rect x="744" y="218" width="294" height="54" rx="8" fill="#24352e"/>
  <text x="768" y="253" class="white mono" font-size="16">03 / ВЫБОРКА v11</text>
  <text x="768" y="305" font-size="20" font-weight="700">Разделение данных</text>
  <rect x="768" y="329" width="246" height="82" rx="5" fill="#e9eee8"/>
  <text x="786" y="365" font-size="26" font-weight="700">68 910</text>
  <text x="786" y="393" class="muted" font-size="16">изображений · обучение</text>
  <rect x="768" y="425" width="246" height="82" rx="5" fill="#f7e7dc"/>
  <text x="786" y="461" font-size="26" font-weight="700">4 369</text>
  <text x="786" y="489" class="muted" font-size="16">изображений · holdout</text>
  <text x="768" y="517" font-size="13" class="muted">Отложенная выборка для проверки</text>
  <text x="768" y="535" font-size="13" class="muted">не участвует в обучении</text>

  <!-- Train -->
  <rect x="1080" y="218" width="288" height="330" rx="8" class="card"/>
  <rect x="1080" y="218" width="288" height="54" rx="8" fill="#24352e"/>
  <text x="1104" y="253" class="white mono" font-size="16">04 / ОБУЧЕНИЕ</text>
  <text x="1104" y="305" font-size="20" font-weight="700">Дообучение детектора</text>
  <text x="1104" y="348" font-size="18">YOLOv8m · размер 1280</text>
  <text x="1104" y="383" font-size="15">Старт: веса предыдущего прогона</text>
  <text x="1104" y="418" font-size="17">План: 15 эпох · batch 2</text>
  <text x="1104" y="453" font-size="17">Зафиксировано: 2 / 15 эпох</text>
  <rect x="1104" y="474" width="236" height="12" rx="6" fill="#e0ded6"/>
  <rect x="1104" y="474" width="31" height="12" rx="6" fill="#d9530b"/>
  <text x="1104" y="520" class="mono" font-size="13" fill="#a33e08">ПРОГОН ЕЩЁ НЕ ЗАВЕРШЁН</text>

  <path d="M370 383 H398" class="line" marker-end="url(#arrow)"/>
  <path d="M706 383 H734" class="line" marker-end="url(#arrow)"/>
  <path d="M1042 383 H1070" class="line" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="72" y="594" width="1296" height="310" rx="8" fill="#24352e"/>
  <text x="104" y="644" class="white mono" font-size="16">05 / ТЕКУЩИЙ РЕЗУЛЬТАТ ВАЛИДАЦИИ</text>
  <text x="104" y="690" class="white" font-size="19">После 2-й эпохи · валидация во время обучения</text>
  <line x1="104" y1="715" x2="1336" y2="715" stroke="#617068" stroke-width="1"/>

  <text x="104" y="766" class="white mono" font-size="14">ТОЧНОСТЬ ДЕТЕКЦИЙ</text>
  <text x="104" y="824" class="white" font-size="42" font-weight="700">85,1%</text>
  <text x="104" y="858" class="darknote" font-size="15">Precision · доля верных находок</text>

  <text x="410" y="766" class="white mono" font-size="14">ПОЛНОТА</text>
  <text x="410" y="824" class="white" font-size="42" font-weight="700">76,7%</text>
  <text x="410" y="858" class="darknote" font-size="15">Recall · доля найденных объектов</text>

  <text x="716" y="766" class="white mono" font-size="14">mAP@0.5</text>
  <text x="716" y="824" class="white" font-size="42" font-weight="700">84,6%</text>
  <text x="716" y="858" class="darknote" font-size="15">Качество детекции при IoU 0,5</text>

  <text x="1022" y="766" class="white mono" font-size="14">mAP@0.5:0.95</text>
  <text x="1022" y="824" class="white" font-size="42" font-weight="700">63,5%</text>
  <text x="1022" y="858" class="darknote" font-size="15">Более строгая оценка точности боксов</text>

  <rect x="72" y="928" width="1296" height="58" rx="5" fill="#f7e7dc"/>
  <text x="96" y="954" font-size="15" font-weight="700" fill="#7f310c">Как читать результат</text>
  <text x="268" y="954" font-size="14">Это промежуточная валидация 2-й эпохи. Итоговую метрику holdout ещё предстоит снять.</text>
  <text x="96" y="975" font-size="12" class="muted">Источники: журнал сборки выборки v11 и checkpoints/equipment_v12ft-2/results.csv.</text>
</svg>
